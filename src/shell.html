<!doctype html>
<html lang="EN-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>CYBERIA MMO</title>
    <meta name="referrer" content="no-referrer">

    <!-- The launch ticket arrives once in the fragment. Keep it in memory only
         and drop it from the address bar and the history. -->
    <script>
        (function () {
            var found = /(?:^|&)ticket=([A-Za-z0-9_-]{43})(?:&|$)/.exec(self.location.hash.slice(1));
            self.CYBERIA_LAUNCH_TICKET = found ? found[1] : '';
            if (self.location.hash) history.replaceState(null, '', self.location.pathname + self.location.search);
        })();
    </script>

    <!-- user-scalable=no: no browser pinch zoom; the game owns pinch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.ico">

    <style>
        body { margin: 0px; overflow: hidden; background-color: black; }
        canvas.emscripten { border: 0px none; background-color: black; display: block; image-rendering: pixelated; }

        /* Splash effects over the canvas. src/preload.c draws the splash text
           and removes #fx on Tap-to-Start. */
        #fx {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            image-rendering: pixelated;
        }
        #fx .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.8) 100%);
        }
        /* Cyberia logo as a 7x8 pixel matrix (one pixel = 1em). The bottom
           margin lifts it above the screen centre, where preload.c draws the
           text. One element is the top-left pixel; box-shadows draw the rest:
             1111111
             1000001
             1011101
             1010101
             1011101
             1000001
             1110111
             0010100 */
        #fx .logo {
            font-size: 22px;
            width: 7em;
            height: 8em;
            margin-bottom: 220px;
            animation: pulse-glow 3s infinite ease-in-out, glitch-anim 10s infinite linear;
        }
        #fx .logo::before {
            content: "";
            display: block;
            width: 1em;
            height: 1em;
            background-color: #f5f5f5;
            box-shadow:
                1em 0 #f5f5f5, 2em 0 #f5f5f5, 3em 0 #f5f5f5, 4em 0 #f5f5f5, 5em 0 #f5f5f5, 6em 0 #f5f5f5,
                0 1em #f5f5f5, 6em 1em #f5f5f5,
                0 2em #f5f5f5, 2em 2em #f5f5f5, 3em 2em #f5f5f5, 4em 2em #f5f5f5, 6em 2em #f5f5f5,
                0 3em #f5f5f5, 2em 3em #f5f5f5, 4em 3em #f5f5f5, 6em 3em #f5f5f5,
                0 4em #f5f5f5, 2em 4em #f5f5f5, 3em 4em #f5f5f5, 4em 4em #f5f5f5, 6em 4em #f5f5f5,
                0 5em #f5f5f5, 6em 5em #f5f5f5,
                0 6em #f5f5f5, 1em 6em #f5f5f5, 2em 6em #f5f5f5, 4em 6em #f5f5f5, 5em 6em #f5f5f5, 6em 6em #f5f5f5,
                2em 7em #f5f5f5, 4em 7em #f5f5f5;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.15)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.45)); }
        }
        @keyframes glitch-anim {
            0%, 96% { transform: translate(0) scale(1); }
            97% { transform: translate(-3px, 2px) scale(1.02); filter: hue-rotate(90deg); }
            98% { transform: translate(3px, -2px) scale(0.98); filter: hue-rotate(-90deg); }
            99% { transform: translate(-3px, -2px) scale(1.02); filter: drop-shadow(0 0 20px red); }
            100% { transform: translate(0) scale(1); }
        }
    </style>
    </head>
    <body>
        <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>
        <div id="fx"><div class="logo"></div><div class="vignette"></div></div>
        <p id="output" />
        <script>
            var Module = {
                arguments: self.CYBERIA_ARGV || [],
                print: (function() {
                    var element = document.getElementById('output');
                    if (element) element.value = ''; // clear browser cache
                    return function(text) {
                        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                        console.log(text);
                        if (element) {
                          element.value += text + "\n";
                          element.scrollTop = element.scrollHeight; // focus on bottom
                        }
                    };
                })(),
                canvas: (function() {
                    var canvas = document.getElementById('canvas');
                    return canvas;
                })()
            };
        </script>
        {{{ SCRIPT }}}
    </body>
</html>
