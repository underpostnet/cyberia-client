
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: client.cyberiaonline.com
  namespace: underpost-workloads
spec:
  virtualhost:
    fqdn: client.cyberiaonline.com
    tls:
      secretName: client.cyberiaonline.com
  routes:
    - conditions:
        - prefix: /test
      
      enableWebsockets: true
      services:
        - name: dd-cyberia-mmo-client-test-development-traffic-service
          port: 8082
          weight: 100
    